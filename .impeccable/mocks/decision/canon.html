<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Canon sketch</title>
<style>
	* { box-sizing: border-box; margin: 0; }
	html, body { width: 1440px; height: 900px; overflow: hidden; }
	body { background: #ffffff; color: #0f172a; font-family: "Segoe UI", Arial, sans-serif; padding: 28px 120px; }
	header { display: flex; justify-content: space-between; align-items: center; font-size: 18px; }
	header b { font-size: 24px; }
	header nav { display: flex; gap: 32px; color: #475569; }
	.hero { margin-block-start: 110px; max-width: 820px; }
	.hero h1 { font-size: 72px; line-height: 1.05; font-weight: 800; }
	.hero p { font-size: 24px; color: #475569; margin-block-start: 22px; }
	.cta { display: flex; gap: 16px; margin-block-start: 34px; }
	.cta span { padding: 16px 28px; border-radius: 10px; font-size: 20px; font-weight: 700; }
	.cta .pri { background: #4f46e5; color: #fff; } .cta .sec { border: 2px solid #cbd5e1; }
	.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-block-start: 90px; }
	.card { height: 200px; border: 1px solid #e2e8f0; border-radius: 14px; background: #f8fafc; }
</style>
</head>
<body>
	<header><b>ברוך מוסטקיס</b><nav><span>פרויקטים</span><span>אודות</span><span>צור קשר</span><span>EN</span></nav></header>
	<div class="hero">
		<h1>מפתח־ווב שאוהב בעיות קשות.</h1>
		<p>בוגר מתמטיקה עיונית, בונה כלים קטנים ופרויקטים גדולים.</p>
		<div class="cta"><span class="pri">לפרויקטים</span><span class="sec">קורות־חיים</span></div>
	</div>
	<div class="cards"><div class="card"></div><div class="card"></div><div class="card"></div></div>
</body>
</html>
