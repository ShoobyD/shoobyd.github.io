<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>3D portfolio canon sketch</title>
<style>
	* { box-sizing: border-box; margin: 0; }
	html, body { width: 1440px; height: 900px; overflow: hidden; }
	body { background: #0b0b10; color: #f2f2f5; font-family: "Segoe UI", Arial, sans-serif; position: relative; }
	.blob { position: absolute; inset-block-start: 180px; inset-inline-end: 160px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c9c9ff, #5a4bff 45%, #1a1440 80%); }
	header { display: flex; justify-content: space-between; padding: 32px 56px; font-size: 20px; }
	.hero { position: absolute; inset-block-start: 300px; inset-inline-start: 120px; width: 640px; }
	.hero h1 { font-size: 88px; line-height: 1; font-weight: 800; }
	.hero p { font-size: 24px; margin-block-start: 20px; color: #c4c4d0; }
	.scroll { position: absolute; inset-block-end: 40px; inset-inline-start: 50%; translate: 50% 0; font-size: 18px; letter-spacing: .3em; }
</style>
</head>
<body>
	<header><b>ברוך מוסטקיס</b><span>עבודות · אודות · צור קשר · EN</span></header>
	<div class="blob"></div>
	<div class="hero"><h1>יוצר חוויות ווב.</h1><p>מפתח־ווב ומתמטיקאי. גללו כדי להתחיל.</p></div>
	<div class="scroll">SCROLL ↓</div>
</body>
</html>
